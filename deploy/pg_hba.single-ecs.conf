# Local socket is confined to the PostgreSQL container; TCP always requires TLS
# and a SCRAM password. No database port is published to the host or Internet.
local all all trust
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
